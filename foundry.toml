[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# The vendored SP1 Groth16 verifier is auto-generated by Succinct; do not reformat it.
[fmt]
ignore = ["src/vendor/**"]
