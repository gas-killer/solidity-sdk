[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
# Low runs value tuned for the deploy-many-instances profile (the factory deploys many
# ArraySummation instances, each embedding the full GasKillerSDK base).
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
