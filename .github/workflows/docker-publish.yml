name: Publish deploy image

# Builds and pushes the solidity-sdk deploy image (forge + contracts) to GHCR.
# The service chart's deploy-target job uses it to deploy a demo target wired to a
# real BLSSignatureChecker.
on:
  push:
    branches:
      - main
      - dev
      - staging
    tags: ["v*"]
  pull_request:
    branches:
      - main
      - dev
      - staging
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gas-killer/solidity-sdk

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag with: sha (always), branch name (push to main/dev/staging), pr-<n> (PRs),
      # and the git tag (v*). `latest` is applied ONLY on a push to the default branch
      # (main) via is_default_branch — never on PRs or dev/staging pushes.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
