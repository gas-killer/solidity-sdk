name: Publish deploy image

# Builds the solidity-sdk deploy image (forge + contracts) and pushes it to GHCR on
# push/tag/manual events; pull requests build only (no push), so forked PRs with a
# read-only GITHUB_TOKEN still validate. The service chart's deploy-target job uses the
# image to deploy a demo target wired to a real BLSSignatureChecker.
on:
  push:
    branches:
      - main
      - dev
      - staging
    tags: ["v*"]
  pull_request:
    branches:
      - main
      - dev
      - staging
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gas-killer/solidity-sdk

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate only when we intend to push (push/tag/manual). PR builds are
      # build-only, so forked PRs (read-only GITHUB_TOKEN) won't fail on login/push.
      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag with: sha (always), branch name (push to main/dev/staging), pr-<n> (PRs),
      # and the git tag (v*). `latest` is applied ONLY on a push to the default branch
      # (main) via is_default_branch — never on PRs or dev/staging pushes.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Build-only on PRs; push on push/tag/manual events.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
