name: Flatten Contracts

on:
  push:
    paths-ignore:
      - 'flat/**'
  pull_request:
    paths-ignore:
      - 'flat/**'
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  flatten:
    name: Flatten Solidity Contracts
    runs-on: ubuntu-latest

    permissions: # allow the default token to push back changes
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # required to push commits

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # ────────────────────────────────────────────────────────────────
      # Auto-flatten everything under src/ into the flat/ directory
      # ────────────────────────────────────────────────────────────────
      - name: Regenerate flat/ directory
        run: |
          rm -rf flat
          mkdir -p flat
          for f in $(git ls-files 'src/*.sol'); do
            base=$(basename "$f" .sol)
            forge flatten "$f" -o "flat/${base}.flat.sol"
          done

      # Sanity-check that each flat file still compiles, with the same solc and settings as the
      # project build. forge picks and checksum-verifies the compiler itself, so there is no
      # separate solc install to drift from it or to depend on the ethereum PPA.
      - name: Compile flattened sources
        run: forge build flat --force

      # Commit & push the fresh flats back to the branch.
      # Skip on pull_request: its merge-commit checkout makes the commit step
      # fail, and the push run already commits the flats.
      - name: Commit flattened contracts
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: flat/*.sol
          commit_message: "chore(flat): auto-flatten solidity sources 🤖"
          push_options: "--follow-tags"
