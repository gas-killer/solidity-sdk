name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check
        id: fmt

      - name: Run Forge build
        run: forge build --sizes
        id: build

      - name: Run Forge tests
        run: forge test -vvv
        id: test

  # gkvm golden fixtures: fresh direct-gk-run vectors must equal the committed
  # test/fixtures/gkvm/*_vectors.json byte for byte, then the ffi suites replay them
  # through GkVmFfiShim (shim output ≡ direct gk-run). `ffi = true` stays confined to
  # the gkvm-ffi profile, which only `make golden-check` selects.
  gkvm-golden:
    name: gkvm golden fixtures
    runs-on: ubuntu-latest

    env:
      # gas-analyzer commit the gk-run sidecar is built from (branch RonTuretzky/gkvm-m6-host — the
      # same ref as gkvm-python-guests: `make test` compares the bundled crt against this
      # checkout's, so it must carry the current gk-guest-crt); bump together with the fixtures
      # when the runner changes
      GK_RUN_REF: f8e6bebc797ee62c49cd2ed1805322458561bcad

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: gas-killer/gas-analyzer
          ref: ${{ env.GK_RUN_REF }}
          path: gas-analyzer

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gas-analyzer

      - name: Build gk-run
        working-directory: gas-analyzer
        run: cargo build --release -p gas-analyzer-gkvm --bin gk-run

      - name: gk unit tests
        run: make -C tools/gk test GAS_ANALYZER="$GITHUB_WORKSPACE/gas-analyzer"

      - name: Golden fixture diff + shim replay
        run: make -C tools/gk golden-check GAS_ANALYZER="$GITHUB_WORKSPACE/gas-analyzer"

  # Python guests of src/examples/onchain-llm-native, rebuilt from source (docker + MicroPython
  # at the pinned commit, cloned on first use): the committed bindings must reproduce, then the
  # consumers' suites run with the real guests behind GkVmFfiShim — stories260k.py must tell the
  # engine-v1 donor's 32-token story bit for bit over the mounted weight blobs (≈ 9.5G guest
  # cycles; the 200-token vector is opt-in, STORIES_LONG=1).
  gkvm-python-guests:
    name: gkvm python guests
    runs-on: ubuntu-latest

    env:
      # needs a gk-run with `--schedule sequential` + `--print-artifact-root`, and the
      # MicroPython port the bundled copy is checked against, and the zero-glue check's
      # local-executor leg (branch RonTuretzky/gkvm-m6-host; ≥ 25fc804 for the explicit
      # freeze order, which port-check compares against the bundled copy)
      GK_RUN_REF: f8e6bebc797ee62c49cd2ed1805322458561bcad

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: gas-killer/gas-analyzer
          ref: ${{ env.GK_RUN_REF }}
          path: gas-analyzer

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gas-analyzer

      - name: Build gk-run
        working-directory: gas-analyzer
        run: cargo build --release -p gas-analyzer-gkvm --bin gk-run

      - name: Bundled crt + MicroPython port == gas-analyzer's
        run: make -C tools/gk crt-check port-check GAS_ANALYZER="$GITHUB_WORKSPACE/gas-analyzer"

      # native-example-check (binding reproduces, consumer suites over the real guest), then
      # the recorded tasks == the fixture == gas-analyzer's copy, then gas-analyzer's local executor
      - name: answer.py — zero-glue check (gk build → forge → local executor, same bytes)
        run: make -C tools/gk zero-glue-check GAS_ANALYZER="$GITHUB_WORKSPACE/gas-analyzer"

      - name: stories260k.py — binding reproduces, the donor's story bit for bit
        run: make -C tools/gk native-stories-check GAS_ANALYZER="$GITHUB_WORKSPACE/gas-analyzer"
